[project]
name = "farm-ai-api"
version = "0.1.0"
description = "FastAPI backend for production farm intelligence workflows."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35.0",
  "email-validator>=2.2.0",
  "fastapi>=0.112.0",
  "google-auth>=2.34.0",
  "httpx>=0.27.0",
  "joblib>=1.4.2",
  "langgraph>=0.2.62",
  "numpy>=1.26.4",
  "opencv-python-headless>=4.10.0.84",
  "passlib[bcrypt]>=1.7.4",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.4.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
  "qdrant-client>=1.11.1",
  "redis>=5.0.8",
  "sqlalchemy>=2.0.32",
  "twilio>=9.2.3",
  "ultralytics>=8.3.0",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "ruff>=0.6.2"
]

[tool.ruff]
line-length = 100
target-version = "py311"
