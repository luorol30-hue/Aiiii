services:
  - type: web
    name: farm-ai-api
    runtime: python
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m app.db_init
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: farm-ai-postgres
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: farm-ai-redis
          property: connectionString
      - key: QDRANT_URL
        value: http://localhost:6333
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_MINUTES
        value: 10080
      - key: CORS_ORIGINS
        value: "*"
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: WEATHER_PROVIDER
        value: openweather
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

databases:
  - name: farm-ai-postgres
    databaseName: farm_ai
    user: postgres
    plan: free

redis:
  - name: farm-ai-redis
    plan: free
    ipAllowList: []
